<div class="table-responsive"><table class="table"><thead><tr><th>Evento / cliente</th><th>Retirada</th><th>Retorno previsto</th><th>Responsável</th><th>Situação</th></tr></thead><tbody>{% for e in events %}<tr><td><a href="{% url 'event' e.pk %}"><strong>{{ e.name }}</strong></a><br><small class="subtle">{{ e.client }}</small></td><td>{{ e.withdrawal|date:'d/m/Y H:i' }}</td><td>{{ e.expected_return|date:'d/m/Y H:i' }}</td><td>{{ e.manager }}</td><td><span class="badge">{{ e.get_status_display }}</span></td></tr>{% empty %}<tr><td colspan="5" class="empty">Nenhum evento nesta seleção.</td></tr>{% endfor %}</tbody></table></div>
