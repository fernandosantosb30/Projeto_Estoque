{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><div class="eyebrow">CADASTRO</div><h1>{{ title }}</h1></div></div><section class="panel form-layout">{% if intro %}<p>{{ intro }}</p>{% endif %}<form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">{{ submit_label|default:"Salvar" }}</button> <a class="btn btn-outline-secondary" href="javascript:history.back()">Voltar</a></form></section>{% if components %}<section class="panel"><h2>Composição atual</h2>{% for c in components %}<p>{{ c }} <a href="?component={{ c.pk }}">Editar quantidade / modelo</a></p>{% endfor %}</section>{% endif %}{% endblock %}
